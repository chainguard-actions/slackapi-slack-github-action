name: Test errors flag behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # With errors=false, a failed request should NOT fail the step
      - id: action-no-error
        uses: .
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload: |
            channel: "C0000000000"
            text: "Test message"
          errors: "false"
      - name: Assert step did not fail with errors=false
        env:
          OUTCOME: ${{ steps.action-no-error.outcome }}
          OK: ${{ steps.action-no-error.outputs.ok }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          # Step should succeed (not fail) even though the API call failed
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected step outcome to be success with errors=false, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: step succeeded with errors=false even though API call failed"
