name: Test errors flag behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With errors=false (default), action should not fail the step even on API error
      - id: action-no-errors
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Test errors=false"}
          errors: "false"

      - name: Assert errors=false step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action-no-errors.outcome }}
          OK: ${{ steps.action-no-errors.outputs.ok }}
          TIME: ${{ steps.action-no-errors.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME (errors=false)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # With errors=true, action should fail the step on API error
      - id: action-with-errors
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Test errors=true"}
          errors: "true"

      - name: Assert errors=true step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action-with-errors.outcome }}
          OK: ${{ steps.action-with-errors.outputs.ok }}
          TIME: ${{ steps.action-with-errors.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME (errors=true)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
