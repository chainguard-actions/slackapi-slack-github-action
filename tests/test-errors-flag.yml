name: Test errors flag causes step failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          errors: "true"
          payload: |
            {"channel": "C0000000000", "text": "Hello from test"}
      - name: Assert step failed when errors=true and request fails
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail when errors=true and request fails, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: step correctly failed with errors=true"
