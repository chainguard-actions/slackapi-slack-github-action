name: Test API method call with invalid token (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload: '{"channel": "C0000000000", "text": "Test message from act"}'
          errors: "false"
      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # With an invalid token, the Slack API should return an auth error
          # The action with errors=false should continue (not throw)
          if [ "$OUTCOME" = "success" ]; then
            # Action completed without throwing; ok should be false due to auth error
            if [ -z "$TIME" ]; then
              echo "FAIL: action succeeded but time output is empty"
              exit 1
            fi
            if [ "$OK" = "true" ]; then
              echo "FAIL: expected ok=false with invalid token but got ok=true"
              exit 1
            fi
            echo "PASS: action completed with ok=$OK (auth error expected), time=$TIME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid token (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
