name: Test proxy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "api.test"
          token: "xoxb-fake-token-for-proxy-test"
          proxy: "https://proxy.example.com:8080"
          payload: '{"foo": "bar"}'
      - name: Assert action ran with proxy input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with proxy input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid token/proxy)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
