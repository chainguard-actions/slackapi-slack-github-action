name: Test proxy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          method: "api.test"
          token: "xoxb-invalid-token-for-testing"
          payload: '{"foo":"bar"}'
          proxy: "https://proxy.example.com:8080"
          errors: "false"
      - name: Assert outputs are present
        env:
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          # The action should complete (errors=false) and produce a time output
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          # ok should be set (true or false)
          if [ "$OK" = "" ]; then
            echo "FAIL: expected ok output to be set"
            exit 1
          fi
          echo "PASS: action completed with proxy input"
