name: Test API method call scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api: "https://slack.com/api"
          method: "chat.postMessage"
          token: "xoxb-fake-token-for-testing"
          payload: '{"channel": "C0000000000", "text": "Hello from test"}'
          errors: "false"
      - name: Assert outputs exist
        env:
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          echo "PASS: action completed (errors=false so failure is acceptable)"
