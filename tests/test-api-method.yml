name: Test API method call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "xoxb-fake-token-for-testing"
          method: "chat.postMessage"
          payload: '{"channel":"C00000000","text":"Hello from test"}'
          api: "https://slack.com/api/"
          errors: "false"
          retries: "0"
      - name: Assert time output exists
        env:
          TIME: ${{ steps.action.outputs.time }}
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "PASS"
