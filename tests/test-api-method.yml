name: Test API method call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload: |
            {"channel": "C0000000000", "text": "Hello from GitHub Actions test"}
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TIME" ]; then
              echo "FAIL: action succeeded but 'time' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with time=$TIME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid token (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
