name: Test webhook incoming
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          webhook: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
          webhook-type: "incoming-webhook"
          payload: '{"text":"Hello from test"}'
          payload-templated: "false"
          errors: "false"
          retries: "0"
          proxy: ""
      - name: Assert ok output exists
        env:
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "PASS"
