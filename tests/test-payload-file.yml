name: Test payload from file with webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create payload file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/payload.json" <<'EOF'
          {"text": "Test message from act via payload file"}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload-file-path: "./tests/fixtures/payload.json"
          errors: "false"
      - name: Assert action ran with payload file
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # The action should attempt to send the payload from the file
          # With an invalid webhook, it will fail at the HTTP level
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TIME" ]; then
              echo "FAIL: action succeeded but time output is empty"
              exit 1
            fi
            echo "PASS: action completed with time=$TIME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid webhook (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
