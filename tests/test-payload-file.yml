name: Test payload from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create payload file
        run: |
          mkdir -p /tmp/slack-test
          cat > /tmp/slack-test/payload.json << 'EOF'
          {"channel": "C0000000000", "text": "Hello from payload file test"}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload-file-path: "/tmp/slack-test/payload.json"
      - name: Assert action ran and produced time output
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
          ACTUAL_TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $ACTUAL_OK"
          echo "time: $ACTUAL_TIME"
          if [ "$ACTUAL_OK" = "true" ]; then
            echo "FAIL: expected ok=false for invalid token"
            exit 1
          fi
          echo "PASS: ok is not true as expected for invalid token"
          if [ -z "$ACTUAL_TIME" ]; then
            echo "FAIL: expected time output to be set even on failure"
            exit 1
          fi
          echo "PASS: time output is set: $ACTUAL_TIME"
