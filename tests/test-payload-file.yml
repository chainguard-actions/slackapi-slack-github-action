name: Test payload from file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create payload file
        run: |
          mkdir -p /tmp/slack-test
          cat > /tmp/slack-test/payload.json <<'EOF'
          {"channel": "C0000000000", "text": "Hello from payload file test"}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload-file-path: "/tmp/slack-test/payload.json"
          errors: "false"
      - name: Assert action ran and returned ok=false (invalid token, but payload file was read)
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
          ACTUAL_RESPONSE: ${{ steps.action.outputs.response }}
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "ok: $ACTUAL_OK"
          echo "response: $ACTUAL_RESPONSE"
          echo "step outcome: $STEP_OUTCOME"
          # The action should attempt the API call (payload file was read)
          # and fail due to invalid token - ok=false or step failure
          if [ "$ACTUAL_OK" = "false" ] || [ "$STEP_OUTCOME" = "failure" ]; then
            echo "PASS: action processed payload file and correctly reported failure for invalid token"
          else
            echo "FAIL: expected ok=false or step failure for invalid token with payload file"
            exit 1
          fi
