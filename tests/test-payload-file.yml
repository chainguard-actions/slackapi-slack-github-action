name: Test payload file path and delimiter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create payload file
        run: |
          cat > /tmp/slack-payload.json <<'EOF'
          {"text": "Hello from payload file"}
          EOF
      - id: action
        uses: .
        with:
          webhook: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
          webhook-type: "incoming-webhook"
          payload-file-path: "/tmp/slack-payload.json"
          payload-delimiter: "."
          errors: "false"
          retries: "0"
      - name: Assert time output exists
        env:
          TIME: ${{ steps.action.outputs.time }}
          OK: ${{ steps.action.outputs.ok }}
        run: |
          echo "ok: $OK"
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "PASS"
