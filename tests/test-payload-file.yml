name: Test payload file path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create payload file
        run: |
          mkdir -p /tmp/slack-test
          cat > /tmp/slack-test/payload.json << 'EOF'
          {
            "text": "Hello from payload file test",
            "username": "test-bot"
          }
          EOF
          echo "Payload file created:"
          cat /tmp/slack-test/payload.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          webhook-type: "incoming-webhook"
          payload-file-path: "/tmp/slack-test/payload.json"
      - name: Assert action ran with payload file
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          # The action should either succeed or fail gracefully
          # A "not found" or "cannot read file" error would indicate a bug
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TIME" ]; then
              echo "FAIL: action succeeded but time output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with payload file, time=$TIME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake webhook, expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
