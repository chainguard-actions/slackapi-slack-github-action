name: Test custom API URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api: "https://slack.com/api/"
          method: "api.test"
          token: "xoxb-invalid-token-for-testing"
          payload: '{"foo":"bar"}'
          errors: "false"
      - name: Assert ok output is present
        env:
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          # The action should complete (errors=false) and produce outputs
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          # ok should be false since token is invalid, but the step should not fail
          if [ "$OK" = "" ]; then
            echo "FAIL: expected ok output to be set (true or false)"
            exit 1
          fi
          echo "PASS: action completed with custom api input"
