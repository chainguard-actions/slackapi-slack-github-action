name: Test retries input configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload: '{"channel": "C0000000000", "text": "Test retries"}'
          retries: "0"
          errors: "false"
      - name: Assert action ran with retries=0
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # With retries=0 and an invalid token, the action should fail quickly
          # without retrying. The action should complete (not hang).
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TIME" ]; then
              echo "FAIL: action succeeded but time output is empty"
              exit 1
            fi
            # ok should be false since token is invalid
            if [ "$OK" = "true" ]; then
              echo "FAIL: expected ok=false with invalid token"
              exit 1
            fi
            echo "PASS: action completed quickly with retries=0, ok=$OK, time=$TIME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid token and retries=0"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
