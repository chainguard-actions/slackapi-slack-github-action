name: Test webhook basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test: posting via webhook with a fake URL and errors=false (default)
      # The action should complete without exiting with an error code,
      # even though the webhook URL is fake and the request will fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Hello from GitHub Actions test"}
          errors: "false"

      - name: Assert action completed with errors=false despite bad webhook
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # With errors=false, the step should succeed even when Slack returns an error
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed as expected with errors=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action exited with error despite errors=false"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
