name: Test basic webhook posting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload: '{"text": "Hello from test"}'
          errors: "false"
      - name: Assert ok output is present
        env:
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          # With an invalid webhook, ok should be false (not empty)
          if [ -z "$OK" ]; then
            echo "FAIL: expected ok output to be set (true or false)"
            exit 1
          fi
          echo "ok output is set: $OK"
          # time should always be set
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "time output is set: $TIME"
          echo "PASS"
