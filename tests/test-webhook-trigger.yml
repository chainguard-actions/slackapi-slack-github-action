name: Test webhook trigger type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          webhook: "https://hooks.slack.com/triggers/INVALID/INVALID/INVALID"
          webhook-type: "webhook-trigger"
          payload: '{"key":"value"}'
          errors: "false"
      - name: Assert ok is false on invalid webhook trigger
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
        run: |
          echo "ok: $ACTUAL_OK"
          if [ "$ACTUAL_OK" != "false" ]; then
            echo "FAIL: expected ok=false but got: $ACTUAL_OK"
            exit 1
          fi
          echo "PASS: ok is false as expected"
      - name: Assert time output is set
        env:
          ACTUAL_TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $ACTUAL_TIME"
          if [ -z "$ACTUAL_TIME" ]; then
            echo "FAIL: expected time to be set but got empty"
            exit 1
          fi
          echo "PASS: time is set to $ACTUAL_TIME"
