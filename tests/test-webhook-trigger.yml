name: Test webhook trigger type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test: using webhook-type=webhook-trigger (Slack workflow trigger)
      # This is different from incoming-webhook and tests a different code path
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/triggers/FAKE/FAKE/FAKE"
          webhook-type: "webhook-trigger"
          payload: |
            {"key": "value", "message": "test trigger payload"}
          errors: "false"

      - name: Assert action ran with webhook-trigger type
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # With errors=false, the step should succeed even when Slack returns an error
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with webhook-trigger type and continued with errors=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action exited with error despite errors=false"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
