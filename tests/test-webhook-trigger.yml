name: Test webhook trigger type with invalid URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/triggers/INVALID/INVALID/INVALID"
          webhook-type: "trigger"
          payload: |
            {"key": "value"}
          errors: "false"
      - name: Assert action handled trigger webhook failure gracefully
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "ok: $ACTUAL_OK"
          echo "step outcome: $STEP_OUTCOME"
          # With an invalid trigger webhook URL, the action should fail gracefully
          if [ "$ACTUAL_OK" = "false" ] || [ "$STEP_OUTCOME" = "failure" ]; then
            echo "PASS: action handled invalid trigger webhook correctly"
          else
            echo "FAIL: expected ok=false or step failure for invalid trigger webhook"
            exit 1
          fi
