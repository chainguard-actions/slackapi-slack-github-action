name: Test webhook trigger type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          webhook: "https://hooks.slack.com/triggers/INVALID/INVALID/INVALID"
          webhook-type: "webhook-trigger"
          payload: '{"key": "value"}'
          errors: "false"
      - name: Assert outputs are set
        env:
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # ok should be set (false with invalid webhook)
          if [ -z "$OK" ]; then
            echo "FAIL: expected ok output to be set"
            exit 1
          fi
          echo "ok is set: $OK"
          # time should always be set
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "time is set: $TIME"
          echo "PASS"
