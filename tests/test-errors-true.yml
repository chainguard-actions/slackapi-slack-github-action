name: Test errors=true causes step failure on API error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload: '{"channel": "C0000000000", "text": "Test message from act"}'
          errors: "true"
      - name: Assert action failed due to errors=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          # With errors=true and an invalid token, the action should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with errors=true and invalid token"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded (unlikely with invalid token), that's unexpected
            echo "WARN: action succeeded unexpectedly; ok=$OK, time=$TIME"
            if [ "$OK" = "false" ] || [ "$OK" = "" ]; then
              echo "FAIL: action should have thrown with errors=true but ok is not true"
              exit 1
            fi
            echo "PASS: action succeeded with valid-looking response"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
