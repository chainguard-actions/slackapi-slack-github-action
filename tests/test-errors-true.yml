name: Test errors true exits on failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test: with errors=true, the action should exit with an error when the API call fails
      # A fake webhook URL will cause an HTTP error, and errors=true means
      # the step should fail (exit with error code)
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Test message"}
          errors: "true"

      - name: Assert action exited with error when errors=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          # With errors=true, the step should fail when Slack returns an error
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action exited with error as expected with errors=true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have exited with error when errors=true and webhook is invalid"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
