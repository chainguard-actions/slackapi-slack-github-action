name: Test payload with template variable substitution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          CUSTOM_VAR: "hello-from-act"
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload: '{"text": "Templated message: ${{ env.CUSTOM_VAR }}"}'
          payload-templated: "true"
          errors: "false"
      - name: Assert action ran with templated payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # The action should process the template and attempt to send the payload
          # With an invalid webhook, it will fail at the HTTP level
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TIME" ]; then
              echo "FAIL: action succeeded but time output is empty"
              exit 1
            fi
            echo "PASS: action completed with time=$TIME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid webhook (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
