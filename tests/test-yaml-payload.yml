name: Test YAML payload format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          method: "conversations.list"
          token: "xoxb-invalid-token-for-testing"
          payload: |
            limit: 10
            exclude_archived: true
          errors: "false"
      - name: Assert outputs are set with YAML payload
        env:
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"
          # ok should be set (false with invalid token)
          if [ -z "$OK" ]; then
            echo "FAIL: expected ok output to be set"
            exit 1
          fi
          if [ "$OK" != "false" ]; then
            echo "FAIL: expected ok=false with invalid token, got: $OK"
            exit 1
          fi
          echo "ok is false as expected"
          # response should contain error info from Slack API
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected response to be set"
            exit 1
          fi
          echo "response is set"
          # time should always be set
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "time is set: $TIME"
          echo "PASS"
