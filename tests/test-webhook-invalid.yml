name: Test webhook with invalid URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Hello from test"}
      - name: Assert ok output is false on invalid webhook
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
          ACTUAL_TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "ok: $ACTUAL_OK"
          echo "time: $ACTUAL_TIME"
          if [ "$ACTUAL_OK" = "true" ]; then
            echo "FAIL: expected ok=false for invalid webhook"
            exit 1
          fi
          echo "PASS: ok is not true as expected for invalid webhook"
          if [ -z "$ACTUAL_TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "PASS: time output is set: $ACTUAL_TIME"
