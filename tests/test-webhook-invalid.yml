name: Test webhook with invalid URL (error handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Hello from test"}
          errors: "false"
      - name: Assert ok output is false or step failed gracefully
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "ok: $ACTUAL_OK"
          echo "step outcome: $STEP_OUTCOME"
          # With an invalid webhook, the action should either:
          # - complete with ok=false (errors=false means it won't throw)
          # - or fail (outcome=failure)
          if [ "$ACTUAL_OK" = "false" ] || [ "$STEP_OUTCOME" = "failure" ]; then
            echo "PASS: action handled invalid webhook correctly"
          else
            echo "FAIL: expected ok=false or step failure for invalid webhook"
            exit 1
          fi
      - name: Assert time output is set
        env:
          ACTUAL_TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $ACTUAL_TIME"
          if [ -n "$ACTUAL_TIME" ]; then
            echo "PASS: time output is set"
          else
            echo "INFO: time output not set (step may have failed before setting outputs)"
          fi
