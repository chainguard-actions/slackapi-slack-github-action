name: Test custom API URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api: "https://slack.com/api/"
          method: "api.test"
          token: "xoxb-invalid-token-for-testing"
          payload: '{"foo": "bar"}'
          errors: "false"
        continue-on-error: true
      - name: Assert step ran with custom api input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "time: $TIME"
          # The step should have run (either succeeded or failed gracefully)
          # with errors: false it should not hard-fail the workflow
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom api input"
