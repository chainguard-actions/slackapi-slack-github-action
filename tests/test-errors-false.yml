name: Test errors false continues on failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test: with errors=false (default), the action should continue even on API errors
      # A fake webhook URL will cause an HTTP error, but errors=false means
      # the step should still succeed (not exit with error code)
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Test message"}
          errors: "false"

      - name: Assert action continued despite API error (errors=false)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OK: ${{ steps.action.outputs.ok }}
          TIME: ${{ steps.action.outputs.time }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "time: $TIME"
          echo "response: $RESPONSE"
          # With errors=false, the step should succeed even when Slack returns an error
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action continued as expected with errors=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action exited with error despite errors=false"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
