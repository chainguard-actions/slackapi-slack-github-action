name: Test API method call with errors false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          method: "chat.postMessage"
          token: "xoxb-invalid-token-for-testing"
          payload: '{"channel":"C0000000000","text":"test message"}'
          errors: "false"
      - name: Assert ok is false on invalid token
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
        run: |
          echo "ok: $ACTUAL_OK"
          if [ "$ACTUAL_OK" != "false" ]; then
            echo "FAIL: expected ok=false but got: $ACTUAL_OK"
            exit 1
          fi
          echo "PASS: ok is false as expected"
      - name: Assert time output is set
        env:
          ACTUAL_TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $ACTUAL_TIME"
          if [ -z "$ACTUAL_TIME" ]; then
            echo "FAIL: expected time to be set but got empty"
            exit 1
          fi
          echo "PASS: time is set to $ACTUAL_TIME"
      - name: Assert response output is set
        env:
          ACTUAL_RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $ACTUAL_RESPONSE"
          if [ -z "$ACTUAL_RESPONSE" ]; then
            echo "FAIL: expected response to be set but got empty"
            exit 1
          fi
          echo "PASS: response is set"
