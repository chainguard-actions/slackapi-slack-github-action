name: Test retries=0 with invalid webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: "https://hooks.slack.com/services/INVALID/INVALID/INVALID"
          webhook-type: "incoming-webhook"
          payload: |
            {"text": "Hello from retries test"}
          retries: "0"
          errors: "false"
      - name: Assert action completed (with retries=0, no retry delay)
        env:
          ACTUAL_OK: ${{ steps.action.outputs.ok }}
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "ok: $ACTUAL_OK"
          echo "step outcome: $STEP_OUTCOME"
          # With retries=0 and invalid webhook, action should fail quickly
          if [ "$ACTUAL_OK" = "false" ] || [ "$STEP_OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with retries=0 and invalid webhook"
          else
            echo "FAIL: expected ok=false or step failure for invalid webhook with retries=0"
            exit 1
          fi
