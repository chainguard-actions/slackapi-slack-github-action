name: Test webhook with payload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          webhook: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          webhook-type: "incoming-webhook"
          payload: '{"text": "Hello from test"}'
          errors: "false"
      - name: Assert time output is set
        env:
          TIME_OUT: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME_OUT"
          if [ -z "$TIME_OUT" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "PASS"
