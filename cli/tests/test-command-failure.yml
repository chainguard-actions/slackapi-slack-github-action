name: Test command failure - ok=false when CLI exits non-zero
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake slack binary that exits with error
        run: |
          sudo mkdir -p /usr/local/bin
          sudo tee /usr/local/bin/slack > /dev/null << 'SLACKEOF'
          #!/bin/bash
          echo "Error: command failed"
          exit 1
          SLACKEOF
          sudo chmod +x /usr/local/bin/slack

          # Verify it's on PATH
          which slack

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "bad-command"

      - name: Assert action failed (exit code propagated)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CLI exits non-zero, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed"

      - name: Assert ok is false
        env:
          OK: ${{ steps.action.outputs.ok }}
        run: |
          echo "ok: $OK"
          if [ "$OK" != "false" ]; then
            echo "FAIL: expected ok=false when command fails, got '$OK'"
            exit 1
          fi
          echo "PASS: ok=false as expected"

      - name: Assert response contains error output
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected non-empty response even on failure"
            exit 1
          fi
          echo "PASS: response is non-empty"

      - name: Assert time is set even on failure
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time to be set even on failure"
            exit 1
          fi
          if ! echo "$TIME" | grep -qE '^[0-9]+$'; then
            echo "FAIL: time '$TIME' is not a numeric unix epoch"
            exit 1
          fi
          echo "PASS: time is a valid unix epoch"
