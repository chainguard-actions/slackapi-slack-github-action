name: Test command failure handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install a fake Slack CLI that exits with failure
        run: |
          # Place a fake slack binary that always fails
          mkdir -p /tmp/failing-slack/bin
          cat > /tmp/failing-slack/bin/slack << 'SLACKEOF'
          #!/bin/sh
          echo "Error: command failed intentionally"
          exit 1
          SLACKEOF
          chmod +x /tmp/failing-slack/bin/slack
          echo "/tmp/failing-slack/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "deploy"

      - name: Assert action step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CLI exits non-zero, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed"

      - name: Assert ok output is false
        env:
          OK: ${{ steps.action.outputs.ok }}
        run: |
          echo "ok: $OK"
          if [ "$OK" != "false" ]; then
            echo "FAIL: expected ok=false when CLI fails, got '$OK'"
            exit 1
          fi
          echo "PASS: ok=false as expected"

      - name: Assert response contains error output
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected non-empty response even on failure"
            exit 1
          fi
          if ! echo "$RESPONSE" | grep -q "Error"; then
            echo "FAIL: expected error message in response, got: $RESPONSE"
            exit 1
          fi
          echo "PASS: response contains error output"
