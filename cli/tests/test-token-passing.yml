name: Test token is passed to Slack CLI command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake slack binary that echoes its arguments
        run: |
          sudo mkdir -p /usr/local/bin
          sudo tee /usr/local/bin/slack > /dev/null << 'SLACKEOF'
          #!/bin/bash
          # Echo all arguments so we can verify token was passed
          echo "ARGS: $*"
          exit 0
          SLACKEOF
          sudo chmod +x /usr/local/bin/slack

          # Verify it's on PATH
          which slack

      - id: action
        uses: .
        with:
          command: "version"
          token: "xoxp-test-token-12345"

      - name: Assert ok is true
        env:
          OK: ${{ steps.action.outputs.ok }}
        run: |
          echo "ok: $OK"
          if [ "$OK" != "true" ]; then
            echo "FAIL: expected ok=true, got '$OK'"
            exit 1
          fi
          echo "PASS: ok=true"

      - name: Assert response contains token flag
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          # The action appends "--token <value>" to the CLI args when token is set
          if ! echo "$RESPONSE" | grep -q "\-\-token"; then
            echo "FAIL: expected '--token' to appear in CLI args"
            exit 1
          fi
          echo "PASS: --token flag was passed to CLI"

      - name: Assert time is a valid unix epoch
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected non-empty time"
            exit 1
          fi
          if ! echo "$TIME" | grep -qE '^[0-9]+$'; then
            echo "FAIL: time '$TIME' is not a numeric unix epoch"
            exit 1
          fi
          echo "PASS: time is a valid unix epoch"
