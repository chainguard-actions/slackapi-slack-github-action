name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: version
          version: "2.26.0"

      - name: Assert ok output is set
        env:
          OK: ${{ steps.action.outputs.ok }}
        run: |
          echo "ok: $OK"
          if [ "$OK" != "true" ] && [ "$OK" != "false" ]; then
            echo "FAIL: expected ok to be 'true' or 'false', got '$OK'"
            exit 1
          fi
          echo "PASS: ok is '$OK'"

      - name: Assert response output is set
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected response to be non-empty"
            exit 1
          fi
          echo "PASS: response is non-empty"

      - name: Assert time output is set
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time to be non-empty"
            exit 1
          fi
          echo "PASS: time is '$TIME'"
