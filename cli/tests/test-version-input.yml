name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: version
          version: "2.26.0"

      - name: Assert version input was accepted and outputs are set
        env:
          OK: ${{ steps.action.outputs.ok }}
          RESPONSE: ${{ steps.action.outputs.response }}
          TIME: ${{ steps.action.outputs.time }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ok: $OK"
          echo "response: $RESPONSE"
          echo "time: $TIME"

          # The action must have run (not been skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi

          # The 'time' output must always be set when the action runs
          if [ -z "$TIME" ]; then
            echo "FAIL: expected 'time' output to be set"
            exit 1
          fi

          # The 'ok' output must be either 'true' or 'false'
          if [ "$OK" != "true" ] && [ "$OK" != "false" ]; then
            echo "FAIL: expected 'ok' to be 'true' or 'false', got: $OK"
            exit 1
          fi

          echo "PASS: version input accepted, outputs ok=$OK time=$TIME"
